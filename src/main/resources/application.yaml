spring:
  application:
    name: project
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/se_project_db}
    username: ${DB_USER:se_project_user}
    password: ${DB_PASSWORD:securepass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false

server:
  port: ${APP_PORT:8080}
