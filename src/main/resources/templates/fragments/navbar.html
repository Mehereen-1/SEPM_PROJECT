<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<body>
<div th:fragment="mainNavbar">
    <style>
        .biblio-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #f5edf1;
            border-bottom: 1px solid #eadce3;
        }

        .biblio-nav-inner {
            max-width: 1240px;
            height: 68px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .biblio-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #111827;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .biblio-brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            background: #f43f6a;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1;
        }

        .biblio-nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .biblio-link {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 999px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .biblio-link:hover {
            color: #f43f6a;
            background: #fff;
        }

        .biblio-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .biblio-icon-btn {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 999px;
            background: #f8d9e4;
            color: #f43f6a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .biblio-icon-btn:hover {
            background: #f7c9da;
            transform: translateY(-1px);
        }

        .biblio-user {
            color: #475569;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .biblio-logout {
            border: 1px solid #f43f6a;
            color: #f43f6a;
            background: transparent;
            border-radius: 999px;
            padding: 7px 12px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .biblio-toggle {
            display: none;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 999px;
            background: #f8d9e4;
            color: #f43f6a;
        }

        @media (max-width: 900px) {
            .biblio-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .biblio-nav-links {
                position: absolute;
                top: 68px;
                left: 0;
                right: 0;
                background: #f5edf1;
                border-bottom: 1px solid #eadce3;
                display: none;
                flex-direction: column;
                align-items: stretch;
                padding: 8px 12px;
            }

            .biblio-nav.open .biblio-nav-links {
                display: flex;
            }

            .biblio-link {
                border-radius: 10px;
                text-align: center;
            }
        }
    </style>

    <header class="biblio-nav" id="biblioNav">
        <div class="biblio-nav-inner">
            <a th:href="@{/}" class="biblio-brand">
                <span class="biblio-brand-mark">📖</span>
                <span>Bibliophile</span>
            </a>

            <button class="biblio-toggle" id="biblioToggle" type="button">
                <span class="material-symbols-rounded">menu</span>
            </button>

            <nav class="biblio-nav-links">
                <a th:href="@{/}" class="biblio-link">Home</a>
                <a th:href="@{/browse}" class="biblio-link">Books</a>
                <a th:href="@{/offers-browse}" class="biblio-link">Offers</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/my-offers}" class="biblio-link">My Offers</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/exchange-center}" class="biblio-link">Exchange</a>
            </nav>

            <div class="biblio-actions">
                <a sec:authorize="!isAuthenticated()" th:href="@{/login(role='BOOK_FRIEND')}" class="biblio-link">Login</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/register(role='BOOK_FRIEND')}" class="biblio-icon-btn" aria-label="Sign up">
                    <span class="material-symbols-rounded" style="font-size: 19px;">person_add</span>
                </a>

                <span sec:authorize="isAuthenticated()" class="biblio-user" th:text="${#authentication.name}">user</span>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="biblio-logout">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <script>
        (function () {
            const nav = document.getElementById('biblioNav');
            const toggle = document.getElementById('biblioToggle');
            if (!nav || !toggle) {
                return;
            }
            toggle.addEventListener('click', function () {
                nav.classList.toggle('open');
            });
        })();
    </script>
</div>

<div th:fragment="autoNavbar">
    <div sec:authorize="isAuthenticated() and hasAnyAuthority('ROLE_DELIVERY_PARTNER', 'ROLE_DELIVERY')"
        th:replace="~{fragments/navbar-delivery :: deliveryNavbar}"></div>
    <div sec:authorize="isAuthenticated() and !hasAnyAuthority('ROLE_DELIVERY_PARTNER', 'ROLE_DELIVERY')"
        th:replace="~{fragments/navbar :: readerNavbar}"></div>
    <div sec:authorize="!isAuthenticated()"
        th:replace="~{fragments/navbar :: mainNavbar}"></div>
</div>
</body>
