<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Offers - BookSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-main: #4a6fa5;
            --brand-accent: #da9db5;
            --ink: #263248;
            --paper: #f5f7fb;
            --card: #ffffff;
            --line: #dce3ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 8%, rgba(74, 111, 165, 0.15), transparent 35%),
                radial-gradient(circle at 88% 22%, rgba(218, 157, 181, 0.2), transparent 30%),
                var(--paper);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(120deg, #4a6fa5, #5f85bd);
            color: white;
            padding: 18px 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 28px rgba(74, 111, 165, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 1.55rem;
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .page-wrap {
            max-width: 1200px;
            margin: 28px auto 60px auto;
            padding: 0 18px;
        }

        .hero-panel {
            background: linear-gradient(145deg, #ffffff, #f2f5fb);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 8px 24px rgba(38, 50, 72, 0.08);
            margin-bottom: 24px;
        }

        .hero-panel h2 {
            margin: 0 0 6px 0;
            font-size: 1.95rem;
            color: #1e2b43;
        }

        .hero-panel p {
            margin: 0;
            color: #52607a;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-top: 18px;
        }

        .toolbar input,
        .toolbar select {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
        }

        .stats {
            margin: 16px 0 8px 0;
            color: #62708a;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .offers-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .offer-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 18px rgba(38, 50, 72, 0.08);
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.45s ease both;
        }

        .offer-gallery {
            height: 220px;
            background: linear-gradient(135deg, #e9eef8, #dce4f3);
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        .offer-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-empty {
            color: #6f7f9c;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .offer-body {
            padding: 16px;
        }

        .offer-title {
            margin: 0;
            font-size: 1.08rem;
            color: #1d2a42;
            line-height: 1.3;
        }

        .offer-author {
            margin: 6px 0 12px 0;
            color: #586a88;
            font-size: 0.95rem;
        }

        .badge-condition {
            background: #edf3ff;
            color: #2f5ea0;
            border: 1px solid #c7d8f6;
            font-size: 0.8rem;
            padding: 5px 9px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .offer-note {
            margin: 0;
            color: #4c5b76;
            line-height: 1.45;
            min-height: 42px;
            font-size: 0.94rem;
        }

        .offer-meta {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #d8e0ee;
            color: #607290;
            font-size: 0.86rem;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .loading,
        .empty,
        .error {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 34px 20px;
            text-align: center;
            color: #5d6b85;
            box-shadow: 0 8px 16px rgba(38, 50, 72, 0.06);
        }

        .error {
            color: #9a2f2f;
            background: #fff5f5;
            border-color: #f1c7c7;
        }

        footer {
            margin-top: 56px;
            padding: 18px;
            text-align: center;
            background: #1f2531;
            color: #ced5e1;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 16px;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .hero-panel h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>BookSwap Offers</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/browse}">Browse Books</a>
        <a th:href="@{/offers-browse}">Offers</a>
        <a th:href="@{/offers-create}">Create Offer</a>
    </nav>
</header>

<main class="page-wrap">
    <section class="hero-panel">
        <h2>Active Exchange Offers</h2>
        <p>Find available book copies from community members and pick your next exchange.</p>

        <div class="toolbar">
            <input id="searchInput" type="text" placeholder="Search by title, author, owner, note...">
            <select id="conditionFilter" aria-label="Condition filter">
                <option value="">All conditions</option>
            </select>
        </div>
    </section>

    <div class="stats" id="offerStats">Loading offers...</div>

    <section id="offersContainer" class="offers-grid" aria-live="polite"></section>
</main>

<footer>
    <p>BookSwap Exchange Network</p>
</footer>

<script src="/js/offers.js"></script>
</body>
</html>
