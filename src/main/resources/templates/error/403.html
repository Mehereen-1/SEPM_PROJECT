<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Binimoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-50 to-purple-50 flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="mb-6">
            <h1 class="text-6xl font-bold text-pink-500 mb-2">403</h1>
            <h2 class="text-2xl font-semibold text-slate-900 mb-2">Access Denied</h2>
            <p class="text-slate-600">You don't have permission to access this resource. Please check that you're logged in with the correct account.</p>
        </div>
        
        <div class="mt-8 space-y-3">
            <a href="/" class="block w-full px-6 py-3 bg-pink-500 text-white font-semibold rounded-lg hover:bg-pink-600 transition">
                Go to Home
            </a>
            <a href="/logout" class="block w-full px-6 py-3 bg-slate-200 text-slate-900 font-semibold rounded-lg hover:bg-slate-300 transition">
                Logout & Try Again
            </a>
        </div>

        <p class="mt-6 text-xs text-slate-500">
            If you believe this is an error, please contact support.
        </p>
    </div>
</body>
</html>
