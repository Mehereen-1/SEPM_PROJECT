<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliophile - User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet" />
    <title>My Offers - BookSwap</title>
    <style>
        :root {
            --ink: #1f2937;
            --paper: #f8fafc;
            --line: #e2e8f0;
            --card: #ffffff;
            --brand: #f43464;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at top, rgba(244, 52, 100, 0.12), transparent 70%),
                        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }

        .page-wrap {
            max-width: 1180px;
            margin: 26px auto 58px;
            padding: 0 16px;
        }

        .hero {
            background: linear-gradient(145deg, #ffffff, #f2f5fb);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(36, 50, 74, 0.08);
        }

        .hero h2 {
            margin: 0 0 6px 0;
            font-size: 1.8rem;
        }

        .hero p {
            margin: 0;
            color: #5a6b88;
        }

        .status-banner {
            margin: 12px 0 16px;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: #fff;
            color: #566785;
            display: none;
        }

        .status-banner.success {
            display: block;
            background: #eefaf2;
            border-color: #b8e2c6;
            color: #1e6f40;
        }

        .status-banner.error {
            display: block;
            background: #fff3f3;
            border-color: #efc7c7;
            color: #8b3131;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 14px;
        }

        .offer-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(36, 50, 74, 0.08);
        }

        .offer-cover {
            height: 180px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #e8eef9, #dce5f3);
            overflow: hidden;
        }

        .offer-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .offer-body {
            padding: 12px;
        }

        .offer-title {
            margin: 0;
            font-size: 1rem;
        }

        .offer-meta {
            margin: 7px 0;
            color: #5f7191;
            font-size: 0.86rem;
            line-height: 1.45;
        }

        .pill {
            display: inline-block;
            font-size: 0.76rem;
            border-radius: 999px;
            border: 1px solid #c8d9f7;
            background: #edf3ff;
            color: #2e5d9e;
            font-weight: 700;
            padding: 4px 8px;
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.83rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
        }

        .btn-edit { background: var(--brand); }
        .btn-delete { background: var(--danger); }

        .empty {
            background: #fff;
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: 22px;
            color: #627492;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(25, 35, 52, 0.54);
            padding: 18px;
        }

        .modal.show { display: block; }

        .modal-content {
            max-width: 520px;
            margin: 8vh auto;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--line);
            padding: 18px;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 11px;
        }

        .field label {
            font-size: 0.86rem;
            color: #55688a;
            font-weight: 700;
        }

        .field input,
        .field textarea,
        .field select {
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 9px 10px;
            font-size: 0.9rem;
        }

        .field textarea { min-height: 96px; resize: vertical; }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-cancel {
            border: 1px solid #ced8ea;
            background: #eef2f9;
            color: #2c425f;
            border-radius: 8px;
            padding: 8px 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save {
            border: none;
            background: var(--success);
            color: #fff;
            border-radius: 8px;
            padding: 8px 11px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: autoNavbar}"></div>
<div th:replace="~{fragments/breadcrumb :: breadcrumb('My Offers')}"></div>

<main class="page-wrap">
    <section class="hero">
        <h2>My Offers</h2>
        <p>View, modify, or delete your own offers from one place.</p>
    </section>

    <div id="statusBanner" class="status-banner" role="status" aria-live="polite"></div>

    <section id="offersContainer" class="offers-grid"></section>
</main>

<div id="editModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <h3>Edit Offer</h3>
        <div class="field">
            <label for="editCondition">Condition</label>
            <select id="editCondition">
                <option value="New">New</option>
                <option value="Like New">Like New</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
                <option value="Worn">Worn</option>
            </select>
        </div>
        <div class="field">
            <label for="editNote">Note</label>
            <textarea id="editNote" placeholder="Describe current condition or notes"></textarea>
        </div>
        <div class="modal-actions">
            <button id="cancelEditBtn" type="button" class="btn-cancel">Cancel</button>
            <button id="saveEditBtn" type="button" class="btn-save">Save Changes</button>
        </div>
    </div>
</div>

<script src="/js/my-offers.js"></script>
</body>
</html>
