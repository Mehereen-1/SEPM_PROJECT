<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Offer - BookSwap</title>
    <style>
        :root {
            --navy: #23395b;
            --blue: #4a6fa5;
            --mint: #d7f2ea;
            --rose: #f8e3ea;
            --paper: #f4f7fb;
            --card: #ffffff;
            --line: #d6deeb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(180deg, rgba(74, 111, 165, 0.06), transparent 220px),
                linear-gradient(120deg, rgba(215, 242, 234, 0.5), rgba(248, 227, 234, 0.45)),
                var(--paper);
            color: var(--navy);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(115deg, #23395b, #31527f);
            color: #fff;
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 26px rgba(35, 57, 91, 0.28);
        }

        header h1 {
            margin: 0;
            font-size: 1.45rem;
            letter-spacing: 0.4px;
        }

        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 999px;
            transition: background 0.2s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .page {
            max-width: 940px;
            margin: 34px auto 60px auto;
            padding: 0 16px;
        }

        .intro {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 20px rgba(35, 57, 91, 0.08);
            margin-bottom: 18px;
        }

        .intro h2 {
            margin: 0 0 6px 0;
            font-size: 1.8rem;
        }

        .intro p {
            margin: 0;
            color: #4f6080;
        }

        .form-shell {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 26px rgba(35, 57, 91, 0.1);
        }

        .field-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 700;
            color: #2d4268;
            font-size: 0.92rem;
        }

        select,
        input,
        textarea {
            width: 100%;
            border: 1px solid #cfd8e8;
            border-radius: 10px;
            padding: 10px 11px;
            font-size: 0.95rem;
            background: #fff;
            color: #21314f;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .hint {
            color: #647596;
            font-size: 0.82rem;
        }

        .selected-book {
            margin-top: 10px;
            padding: 10px 12px;
            background: linear-gradient(115deg, #eef5ff, #f8fbff);
            border: 1px dashed #b8c9e8;
            border-radius: 10px;
            color: #37517b;
            font-size: 0.9rem;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 11px 20px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: linear-gradient(120deg, #31527f, #4a6fa5);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-secondary {
            background: #e9eef7;
            color: #2d446a;
        }

        .status-box {
            margin-top: 14px;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.92rem;
            display: none;
        }

        .status-box.success {
            display: block;
            background: #e8f9f0;
            border: 1px solid #bfe8cf;
            color: #1f6a3f;
        }

        .status-box.error {
            display: block;
            background: #fff1f1;
            border: 1px solid #f3caca;
            color: #8a3131;
        }

        .preview-list {
            margin: 8px 0 0 0;
            padding-left: 18px;
            color: #4b5d7c;
            font-size: 0.88rem;
        }

        @media (max-width: 760px) {
            .field-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 10px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>BookSwap</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/offers-browse}">Browse Offers</a>
        <a th:href="@{/offers-create}">Create Offer</a>
    </nav>
</header>

<main class="page">
    <section class="intro">
        <h2>Create a New Exchange Offer</h2>
        <p>Select a book from the catalog, describe your copy, and upload photos so others can view it.</p>
    </section>

    <section class="form-shell">
        <form id="createOfferForm" novalidate>
            <div class="field-grid">
                <div class="field full">
                    <label for="bookId">Book from Catalog</label>
                    <select id="bookId" required>
                        <option value="">Loading books...</option>
                    </select>
                    <div class="hint">Choose the catalog book that matches your copy.</div>
                    <div id="selectedBookInfo" class="selected-book" style="display: none;"></div>
                </div>

                <div class="field">
                    <label for="condition">Condition</label>
                    <select id="condition" required>
                        <option value="">Select condition</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Worn">Worn</option>
                    </select>
                </div>

                <div class="field">
                    <label for="images">Photos (optional)</label>
                    <input id="images" type="file" accept="image/*" multiple>
                    <div class="hint">You can upload multiple images.</div>
                </div>

                <div class="field full">
                    <label for="note">Note</label>
                    <textarea id="note" placeholder="Example: Minimal highlighting on chapter 2, no torn pages."></textarea>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">Create Offer</button>
                <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
            </div>

            <div id="statusBox" class="status-box"></div>
            <ul id="imagePreviewList" class="preview-list"></ul>
        </form>
    </section>
</main>

<script src="/js/offers-create.js"></script>
</body>
</html>
