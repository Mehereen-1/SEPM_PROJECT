<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Bookaroo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-50 to-purple-50 flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="mb-6">
            <h1 class="text-6xl font-bold text-pink-500 mb-2">404</h1>
            <h2 class="text-2xl font-semibold text-slate-900 mb-2">Page Not Found</h2>
            <p class="text-slate-600">The page you're looking for doesn't exist. It may have been moved or deleted.</p>
        </div>
        
        <div class="mt-8">
            <a href="/" class="inline-block px-6 py-3 bg-pink-500 text-white font-semibold rounded-lg hover:bg-pink-600 transition">
                Back to Home
            </a>
        </div>
    </div>
</body>
</html>
